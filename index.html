<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa da Beleza | Agendamentos</title>

  <style>
    body {
      margin: 0;
      background: #f5c842;
      font-family: Arial, sans-serif;
      color: #000;
    }


    /* TOPO */
    .topo {
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      width: 150px;
      max-width: none;
      height: auto;
      position: absolute;
      left: 20px;
      top: 10px;
    }

    @media (max-width: 480px) {
      .logo {
        width: 90px;
      }
    }


    .titulo {
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .card-form {
      width: 320px;
      padding: 25px;
      background: #fff;
      border: 1px solid #d4af37;
    }


    .card-form label {
      display: block;
      color: #d4af37;
      font-weight: 500;
      margin-top: 10px;
      font-size: 14px;
    }

    .card-form input {
      background: #fff;
      color: #000;
    }


    /* BOTÃO LUXO */
    .card-form button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #d4af37, #b8962e);
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    .card-form button:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .container {
        margin-top: 20px;
      }

      .card-form {
        width: 90%;
      }

    }
  </style>
</head>

<body>

  <header class="topo">
    <img src="logobeleza.jpg" alt="Casa da Beleza" class="logo">
    <h1 class="titulo">Agendamentos</h1>
  </header>

  <div class="container">
    <div class="card-form">
      <label>Nome</label>
      <input id="nome" type="text" placeholder="Opcional">

      <label>Telefone</label>
      <input id="telefone" type="tel" placeholder="(00) 00000-0000">

      <label>Serviço</label>
      <input id="servico" type="text" placeholder="Ex: Escova">

     <label for="data">Data</label>
<input
  type="date"
  id="data"
  name="data"
  class="input-data"
  required
>

      <label>Horário</label>
      <input id="hora" type="time">

      <button type="button" onclick="agendar()">Agendar</button>
    </div>
  </div>

  <script>
    function agendar() {
      const dados = {
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        servico: document.getElementById("servico").value,
        data: document.getElementById("data").value,
        hora: document.getElementById("hora").value
      };

      fetch("https://script.google.com/macros/s/AKfycbyKZkygoxsFXBufhhWmvT8VSEh5g7uelcoZxWhMTE1Vma4t4nL5vePsmhTdHBgpSDfc/exec", {
        method: "POST",
        body: JSON.stringify(dados)
      })
        .then(() => {
          window.location.href = "lista.html";
        })
        .catch(err => {
          alert("Erro ao salvar");
          console.error(err);
        });
    }
  </script>

</body>


</html>
